<!doctype html>
<!--
  One App Store screenshot: a headline over an iPhone or iPad showing a simulator capture.
  Rendered by scripts/make-appstore-screenshots.sh, which passes:
    device  "iphone" (1320 x 2868, the 6.9" size, from an iPhone 17 capture of 1206 x 2622)
            or "ipad" (2064 x 2752, the 13" size, from an iPad Pro 13" capture of the same size)
    screen  the capture, relative to this file
    style   "3d" for a tilted device with a visible edge, "flat" for a larger device seen straight on
    title   the white lines of the headline, separated by "|" (one line on the iPad, which is wide enough)
    accent  the last line, drawn in the orange gradient
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --w: 1320px;
    --h: 2868px;
    --screen-w: 860px;
    --screen-h: calc(var(--screen-w) * 2622 / 1206);
    --rim: 9px;
    --bezel: 17px;
    --pad: calc(var(--rim) + var(--bezel));
    --phone-w: calc(var(--screen-w) + 2 * var(--pad));
    --phone-h: calc(var(--screen-h) + 2 * var(--pad));
    --screen-r: calc(var(--screen-w) * 0.13);
    --phone-r: calc(var(--screen-r) + var(--pad));
  }
  :root.flat { --screen-w: 900px; }
  /* The iPad: a wider canvas, even bezels, gently rounded corners. */
  :root.ipad {
    --w: 2064px;
    --h: 2752px;
    --screen-w: 1400px;
    --screen-h: calc(var(--screen-w) * 2752 / 2064);
    --rim: 7px;
    --bezel: 54px;
    --screen-r: calc(var(--screen-w) * 0.028);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  /* The background and its glows: violet and blue at the top, orange behind the phone, amber at the bottom right. */
  html { background:
    radial-gradient(closest-side, rgba(124,77,255,.30), rgba(124,77,255,0)) -520px -420px / 1400px 1400px no-repeat,
    radial-gradient(closest-side, rgba(47,107,255,.22), rgba(47,107,255,0)) 580px -300px / 1300px 1300px no-repeat,
    radial-gradient(closest-side, rgba(229,112,0,.42), rgba(229,112,0,.12) 55%, rgba(229,112,0,0)) -290px 1080px / 1900px 1900px no-repeat,
    radial-gradient(closest-side, rgba(255,154,60,.16), rgba(255,154,60,0)) 720px 2050px / 1000px 1000px no-repeat,
    linear-gradient(160deg, #1d1d24 0%, #0c0c0f 55%, #08080a 100%) 0 0 / var(--w) var(--h) no-repeat #08080a; }
  /* The same glows spread over the iPad's wider canvas. */
  :root.ipad { background:
    radial-gradient(closest-side, rgba(124,77,255,.30), rgba(124,77,255,0)) -810px -400px / 1820px 1820px no-repeat,
    radial-gradient(closest-side, rgba(47,107,255,.22), rgba(47,107,255,0)) 900px -290px / 1690px 1690px no-repeat,
    radial-gradient(closest-side, rgba(229,112,0,.42), rgba(229,112,0,.12) 55%, rgba(229,112,0,0)) -200px 710px / 2470px 2470px no-repeat,
    radial-gradient(closest-side, rgba(255,154,60,.16), rgba(255,154,60,0)) 1130px 1970px / 1300px 1300px no-repeat,
    linear-gradient(160deg, #1d1d24 0%, #0c0c0f 55%, #08080a 100%) 0 0 / var(--w) var(--h) no-repeat #08080a; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-font-smoothing: antialiased; }

  .canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; }

  svg.network { position: absolute; inset: 0; }

  .headline { position: absolute; top: 196px; left: 0; right: 0; text-align: center; color: #fff;
    font-size: 128px; font-weight: 800; letter-spacing: -3px; line-height: 1.04; }
  :root.ipad .headline { top: 190px; font-size: 140px; }
  .headline .lines { display: inline-block; white-space: nowrap; }
  .headline .accent { background: linear-gradient(90deg, #FFB45C, #F06A00); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .floor { position: absolute; left: 50%; top: 2580px; width: 980px; height: 170px; margin-left: -460px;
    background: radial-gradient(closest-side, rgba(0,0,0,.85), rgba(0,0,0,0)); filter: blur(18px); }
  :root.ipad .floor { top: 2560px; width: 1500px; margin-left: -700px; }

  .stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); perspective: 3400px; perspective-origin: 50% 1500px; }
  :root.ipad .stage { perspective-origin: 50% 1550px; }
  .phone { position: absolute; left: 50%; top: 1660px; width: var(--phone-w); height: var(--phone-h);
    margin-left: calc(var(--phone-w) / -2); margin-top: calc(var(--phone-h) / -2);
    transform-style: preserve-3d; transform: rotateX(9deg) rotateY(24deg) rotateZ(-5deg); }
  :root.ipad .phone { top: 1650px; }
  :root.flat .phone { top: calc(730px + var(--phone-h) / 2); transform: none; }
  :root.ipad.flat .phone { top: calc(620px + var(--phone-h) / 2); }
  :root.flat .floor { display: none; }
  :root.flat .front { box-shadow: 0 60px 120px rgba(0,0,0,.6), 0 20px 40px rgba(0,0,0,.35); }

  .slab { position: absolute; inset: 0; border-radius: var(--phone-r); }
  .button { position: absolute; border-radius: 7px; }

  .front { position: absolute; inset: 0; border-radius: var(--phone-r); transform: translateZ(0.5px);
    background: linear-gradient(135deg, #c9c9cf 0%, #6c6c74 14%, #34343a 40%, #2a2a30 62%, #6a6a72 86%, #c2c2c8 100%); }
  .front::before { content: ""; position: absolute; inset: 2px; border-radius: calc(var(--phone-r) - 2px);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .bezel { position: absolute; inset: var(--rim); border-radius: calc(var(--phone-r) - var(--rim)); background: #030303; }
  .screen { position: absolute; left: var(--pad); top: var(--pad); width: var(--screen-w); height: var(--screen-h);
    border-radius: var(--screen-r); overflow: hidden; background: #000; }
  .screen img { width: 100%; height: 100%; display: block; }
  .glare { position: absolute; inset: 0;
    background: linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 26%, rgba(255,255,255,0) 42%, rgba(255,255,255,0) 70%, rgba(255,255,255,.04) 100%); }
  .island { position: absolute; left: 50%; top: calc(var(--pad) + var(--screen-w) * 0.027); width: calc(var(--screen-w) * 0.293);
    height: calc(var(--screen-w) * 0.086); transform: translateX(-50%); border-radius: 999px; background: #000; }
  /* The iPad has its front camera in the bezel of the long edge, which is on the side when it stands upright. */
  .camera { display: none; position: absolute; right: calc(var(--pad) / 2 - 7px); top: 50%; width: 14px; height: 14px; margin-top: -7px;
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2c3a58, #0b0b10 60%); }
  :root.ipad .island { display: none; }
  :root.ipad .camera { display: block; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="network" id="network"></svg>

  <div class="headline" id="headline"></div>

  <div class="floor"></div>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="front">
        <div class="bezel"></div>
        <div class="screen"><img id="screen"><div class="glare"></div></div>
        <div class="island"></div>
        <div class="camera"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const ipad = params.get("device") === "ipad";
  const flat = params.get("style") === "flat";
  document.documentElement.classList.toggle("ipad", ipad);
  document.documentElement.classList.toggle("flat", flat);
  document.getElementById("screen").src = params.get("screen");
  const canvas = document.querySelector(".canvas");
  const canvasWidth = canvas.offsetWidth, canvasHeight = canvas.offsetHeight;

  // The headline: white lines and the orange accent line, shrunk if a line would come too close to the edges.
  const headline = document.getElementById("headline");
  const lines = document.createElement("span");
  lines.className = "lines";
  const title = (params.get("title") || "").split("|").filter(Boolean);
  for (const line of ipad ? [title.join(" ")] : title) {
    lines.append(line, document.createElement("br"));
  }
  const accent = document.createElement("span");
  accent.className = "accent";
  accent.textContent = params.get("accent") || "";
  lines.append(accent);
  headline.append(lines);
  const maxWidth = canvasWidth - (ipad ? 240 : 120);
  let fontSize = parseFloat(getComputedStyle(headline).fontSize);
  while (lines.offsetWidth > maxWidth) headline.style.fontSize = `${fontSize -= 2}px`;

  const phone = document.getElementById("phone");
  const phoneWidth = phone.offsetWidth, phoneHeight = phone.offsetHeight;
  // Buttons as [edge, start, length], start and length as fractions of that edge: the iPhone's action and volume
  // buttons on the left and its side button on the right; the iPad's top button and its volume buttons on the right.
  const buttons = ipad
    ? [["top", 0.74, 0.09], ["right", 0.075, 0.05], ["right", 0.135, 0.05]]
    : [["left", 0.155, 0.036], ["left", 0.222, 0.072], ["left", 0.31, 0.072], ["right", 0.25, 0.105]];
  const addButton = (slab, edge, start, length, color) => {
    const button = document.createElement("div");
    button.className = "button";
    const position = edge === "top"
      ? `top:-6px;left:${start * phoneWidth}px;width:${length * phoneWidth}px;height:14px`
      : `${edge}:-6px;top:${start * phoneHeight}px;height:${length * phoneHeight}px;width:14px`;
    button.style.cssText = `${position};background:${color}`;
    slab.appendChild(button);
  };

  // Seen straight on, only the buttons stick out of the device's outline.
  if (flat) {
    const slab = document.createElement("div");
    slab.className = "slab";
    const shading = { left: "90deg", right: "270deg", top: "180deg" };
    for (const [edge, start, length] of buttons) {
      addButton(slab, edge, start, length, `linear-gradient(${shading[edge]}, #8e8e95, #3a3a40)`);
    }
    phone.insertBefore(slab, phone.firstChild);
  }

  // The tilted device's body: thin slabs stacked behind the front, so its rounded edge has real depth.
  // The iPad is much thinner for its size than the iPhone.
  const depth = ipad ? 40 : 96, step = ipad ? 1.25 : 1.5;
  const count = flat ? 0 : Math.round(depth / step);
  for (let i = 1; i <= count; i++) {
    const t = i / count;
    // Bright chamfer just behind the front, darker metal in the middle, a softer highlight at the back.
    const light = t < 0.08 ? 62 - t * 300 : t > 0.9 ? 30 + (t - 0.9) * 140 : 34 - Math.sin(t * Math.PI) * 6;
    const slab = document.createElement("div");
    slab.className = "slab";
    slab.style.transform = `translateZ(${-i * step}px)`;
    slab.style.background = `linear-gradient(180deg, hsl(240 4% ${light + 10}%) 0%, hsl(240 4% ${light}%) 22%, hsl(240 4% ${light - 8}%) 55%, hsl(240 4% ${light + 4}%) 100%)`;
    if (t > 0.3 && t < 0.7) {
      for (const [edge, start, length] of buttons) addButton(slab, edge, start, length, `hsl(240 4% ${light + 6}%)`);
    }
    phone.insertBefore(slab, phone.firstChild);
  }

  // Faint network of nodes on both sides of the device, like the README art, laid out on the iPhone's canvas and
  // stretched to the iPad's.
  const scaleX = canvasWidth / 1320, scaleY = canvasHeight / 2868;
  const points = [
    [70, 980], [190, 900], [130, 1120], [250, 1060], [60, 1300], [210, 1250], [120, 1480],
    [1250, 1000], [1120, 940], [1200, 1180], [1080, 1120], [1260, 1360], [1110, 1320], [1210, 1540],
  ].map(([x, y]) => [x * scaleX, y * scaleY]);
  const lit = new Set([3, 5, 8, 12]);
  const links = new Set();
  const half = canvasWidth / 2;
  points.forEach(([x, y], i) => {
    points.map((p, j) => [j, (p[0] - x) ** 2 + (p[1] - y) ** 2])
      .filter(([j]) => j !== i && (points[j][0] < half) === (x < half))
      .sort((a, b) => a[1] - b[1]).slice(0, 2)
      .forEach(([j]) => links.add([Math.min(i, j), Math.max(i, j)].join("-")));
  });
  let d = "";
  for (const key of links) {
    const [a, b] = key.split("-").map(Number);
    d += `M${points[a][0]} ${points[a][1]}L${points[b][0]} ${points[b][1]}`;
  }
  let svg = `<path d="${d}" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>`;
  points.forEach(([x, y], i) => {
    svg += lit.has(i)
      ? `<circle cx="${x}" cy="${y}" r="18" fill="#ff8a1f" fill-opacity="0.16"/><circle cx="${x}" cy="${y}" r="6.5" fill="#ff9f40"/>`
      : `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" fill-opacity="0.26"/>`;
  });
  const network = document.getElementById("network");
  network.setAttribute("width", canvasWidth);
  network.setAttribute("height", canvasHeight);
  network.innerHTML = svg;
</script>
</body>
</html>
