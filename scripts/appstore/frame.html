<!doctype html>
<!--
  One App Store screenshot: a headline over a 3D iPhone showing a simulator capture.
  Rendered at 1320 x 2868 (the 6.9" iPhone size) by scripts/make-appstore-screenshots.sh, which passes:
    screen  the capture, relative to this file (1206 x 2622, iPhone 17)
    title   the white lines of the headline, separated by "|"
    accent  the last line, drawn in the orange gradient
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --w: 1320px;
    --h: 2868px;
    --screen-w: 860px;
    --screen-h: calc(var(--screen-w) * 2622 / 1206);
    --rim: 9px;
    --bezel: 17px;
    --pad: calc(var(--rim) + var(--bezel));
    --phone-w: calc(var(--screen-w) + 2 * var(--pad));
    --phone-h: calc(var(--screen-h) + 2 * var(--pad));
    --screen-r: 112px;
    --phone-r: calc(var(--screen-r) + var(--pad));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  /* The background and its glows: violet and blue at the top, orange behind the phone, amber at the bottom right. */
  html { background:
    radial-gradient(closest-side, rgba(124,77,255,.30), rgba(124,77,255,0)) -520px -420px / 1400px 1400px no-repeat,
    radial-gradient(closest-side, rgba(47,107,255,.22), rgba(47,107,255,0)) 580px -300px / 1300px 1300px no-repeat,
    radial-gradient(closest-side, rgba(229,112,0,.42), rgba(229,112,0,.12) 55%, rgba(229,112,0,0)) -290px 1080px / 1900px 1900px no-repeat,
    radial-gradient(closest-side, rgba(255,154,60,.16), rgba(255,154,60,0)) 720px 2050px / 1000px 1000px no-repeat,
    linear-gradient(160deg, #1d1d24 0%, #0c0c0f 55%, #08080a 100%) 0 0 / var(--w) var(--h) no-repeat #08080a; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-font-smoothing: antialiased; }

  .canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; }

  svg.network { position: absolute; inset: 0; }

  .headline { position: absolute; top: 196px; left: 0; right: 0; text-align: center; color: #fff;
    font-size: 128px; font-weight: 800; letter-spacing: -3px; line-height: 1.04; }
  .headline .accent { background: linear-gradient(90deg, #FFB45C, #F06A00); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .floor { position: absolute; left: 50%; top: 2580px; width: 980px; height: 170px; margin-left: -460px;
    background: radial-gradient(closest-side, rgba(0,0,0,.85), rgba(0,0,0,0)); filter: blur(18px); }

  .stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); perspective: 3400px; perspective-origin: 50% 1500px; }
  .phone { position: absolute; left: 50%; top: 1660px; width: var(--phone-w); height: var(--phone-h);
    margin-left: calc(var(--phone-w) / -2); margin-top: calc(var(--phone-h) / -2);
    transform-style: preserve-3d; transform: rotateX(9deg) rotateY(24deg) rotateZ(-5deg); }

  .slab { position: absolute; inset: 0; border-radius: var(--phone-r); }
  .button { position: absolute; width: 14px; border-radius: 7px; }

  .front { position: absolute; inset: 0; border-radius: var(--phone-r); transform: translateZ(0.5px);
    background: linear-gradient(135deg, #c9c9cf 0%, #6c6c74 14%, #34343a 40%, #2a2a30 62%, #6a6a72 86%, #c2c2c8 100%); }
  .front::before { content: ""; position: absolute; inset: 2px; border-radius: calc(var(--phone-r) - 2px);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .bezel { position: absolute; inset: var(--rim); border-radius: calc(var(--phone-r) - var(--rim)); background: #030303; }
  .screen { position: absolute; left: var(--pad); top: var(--pad); width: var(--screen-w); height: var(--screen-h);
    border-radius: var(--screen-r); overflow: hidden; background: #000; }
  .screen img { width: 100%; height: 100%; display: block; }
  .glare { position: absolute; inset: 0;
    background: linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 26%, rgba(255,255,255,0) 42%, rgba(255,255,255,0) 70%, rgba(255,255,255,.04) 100%); }
  .island { position: absolute; left: 50%; top: calc(var(--pad) + 23px); width: 252px; height: 74px; margin-left: -126px;
    border-radius: 37px; background: #000; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="network" id="network" width="1320" height="2868"></svg>

  <div class="headline" id="headline"></div>

  <div class="floor"></div>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="front">
        <div class="bezel"></div>
        <div class="screen"><img id="screen"><div class="glare"></div></div>
        <div class="island"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById("screen").src = params.get("screen");
  const headline = document.getElementById("headline");
  for (const line of (params.get("title") || "").split("|").filter(Boolean)) {
    headline.append(line, document.createElement("br"));
  }
  const accent = document.createElement("span");
  accent.className = "accent";
  accent.textContent = params.get("accent") || "";
  headline.append(accent);

  // The phone's body: thin slabs stacked behind the front, so its rounded edge has real depth.
  const phone = document.getElementById("phone");
  const depth = 96, step = 1.5;
  const count = Math.round(depth / step);
  // Side buttons along the left edge (top offset and height in px), only on the middle slabs.
  const buttons = [[300, 70], [430, 140], [600, 140]];
  for (let i = 1; i <= count; i++) {
    const t = i / count;
    // Bright chamfer just behind the front, darker metal in the middle, a softer highlight at the back.
    const light = t < 0.08 ? 62 - t * 300 : t > 0.9 ? 30 + (t - 0.9) * 140 : 34 - Math.sin(t * Math.PI) * 6;
    const slab = document.createElement("div");
    slab.className = "slab";
    slab.style.transform = `translateZ(${-i * step}px)`;
    slab.style.background = `linear-gradient(180deg, hsl(240 4% ${light + 10}%) 0%, hsl(240 4% ${light}%) 22%, hsl(240 4% ${light - 8}%) 55%, hsl(240 4% ${light + 4}%) 100%)`;
    if (t > 0.3 && t < 0.7) {
      for (const [top, height] of buttons) {
        const button = document.createElement("div");
        button.className = "button";
        button.style.cssText = `left:-6px;top:${top}px;height:${height}px;background:hsl(240 4% ${light + 6}%)`;
        slab.appendChild(button);
      }
    }
    phone.insertBefore(slab, phone.firstChild);
  }

  // Faint network of nodes on both sides of the phone, like the README art.
  const points = [
    [70, 980], [190, 900], [130, 1120], [250, 1060], [60, 1300], [210, 1250], [120, 1480],
    [1250, 1000], [1120, 940], [1200, 1180], [1080, 1120], [1260, 1360], [1110, 1320], [1210, 1540],
  ];
  const lit = new Set([3, 5, 8, 12]);
  const lines = new Set();
  points.forEach(([x, y], i) => {
    points.map((p, j) => [j, (p[0] - x) ** 2 + (p[1] - y) ** 2])
      .filter(([j]) => j !== i && (points[j][0] < 660) === (x < 660))
      .sort((a, b) => a[1] - b[1]).slice(0, 2)
      .forEach(([j]) => lines.add([Math.min(i, j), Math.max(i, j)].join("-")));
  });
  let d = "";
  for (const key of lines) {
    const [a, b] = key.split("-").map(Number);
    d += `M${points[a][0]} ${points[a][1]}L${points[b][0]} ${points[b][1]}`;
  }
  let svg = `<path d="${d}" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>`;
  points.forEach(([x, y], i) => {
    svg += lit.has(i)
      ? `<circle cx="${x}" cy="${y}" r="18" fill="#ff8a1f" fill-opacity="0.16"/><circle cx="${x}" cy="${y}" r="6.5" fill="#ff9f40"/>`
      : `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" fill-opacity="0.26"/>`;
  });
  document.getElementById("network").innerHTML = svg;
</script>
</body>
</html>
